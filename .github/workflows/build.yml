name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  TYPST_VERSION: "0.15.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install-typst
        with:
          version: ${{ env.TYPST_VERSION }}
      - run: |
          mkdir -p build
          typst compile --font-path src/assets/fonts main.typ build/Aufgabenliste.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: aufgabenliste
          path: build/Aufgabenliste.pdf
